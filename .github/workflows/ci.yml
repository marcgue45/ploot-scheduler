# Pipeline. PR: typecheck + tests de integración contra Postgres + escaneo de secretos + imagen.
# Push: además publica la imagen en GHCR (la que usa docker compose para arrancar en < 60 s).
# Despliegue: Vercel (app) y Railway (worker, mock) despliegan desde Git: preview por PR, prod en main.
# Ver PDF B.2 para la aprobación manual (GitHub Environment) y el rollback automático por métricas.
name: ci

on:
  pull_request:
  push:
    branches: [main, assessment]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc --noEmit -p app/tsconfig.json
      - run: npm test
        env:
          TEST_PG_URL: postgres://postgres:postgres@localhost:5432
      - name: Escaneo de secretos (repo + historial)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ploot-scheduler:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ploot-scheduler:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
